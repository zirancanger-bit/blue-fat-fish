<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'"><title>蓝色大肥鱼 · 潮汐小屋</title><link rel="stylesheet" href="home.css"></head>
<body><header><div class="brand"><span class="emblem">◒</span><div><h1>蓝色大肥鱼的潮汐小屋</h1><p>A LITTLE WHALE, A LITTLE COMPANY</p></div></div><button id="recall">回到桌角 ↗</button></header>
<main><section class="portrait"><div class="portrait-label"><span class="status-dot"></span><span id="pose-label">在这里陪你</span></div><canvas id="portrait" aria-label="蓝色大肥鱼互动预览，可拖动旋转" tabindex="0"></canvas><div id="line" role="status">圆手和尾巴都带来了。</div><div class="portrait-tools"><button id="reset-view">正面</button><button id="side-view">看尾巴</button><button id="preview-lift">按住提尾巴</button><button id="photo">保存照片</button></div><small>拖动转一转 · 点击摸摸 · 双击回正</small></section>
<section class="controls"><div class="section-title"><span>01 / 打个招呼</span><h2>今天想怎么玩？</h2></div><div class="hero-actions"><button data-action="tailtap"><span class="action-glyph">≈</span><b>尾巴连拍三下</b><small>啪 · 啪 · 啪</small></button><button data-action="shy"><span class="action-glyph pink">♡</span><b>害羞一下</b><small>低头，圆手收好</small></button></div>
<div class="action-grid"><button data-action="pet">摸摸脑袋</button><button data-action="wave">挥挥圆手</button><button data-action="jump">轻轻蹦一下</button><button data-action="dance">摇摇摆摆</button><button data-action="sleep">小憩</button><button data-action="wake">醒醒</button><button data-action="smile">微笑</button><button data-action="angry">生气</button><button data-action="walk">散步一小段</button></div>
<div class="section-title lower"><span>02 / 相处习惯</span><h2>舒服地待在桌角</h2></div><div class="setting"><label for="size">桌宠大小</label><output id="size-value">100%</output><input id="size" type="range" min="65" max="150" step="5" value="100"></div>
<div class="switches"><label><input type="checkbox" data-setting="sound" checked>互动音效</label><label><input type="checkbox" data-setting="speech" checked>偶尔说句话</label><label><input type="checkbox" data-setting="alwaysOnTop" checked>始终置顶</label><label><input type="checkbox" data-setting="roam">自己散步</label><label><input type="checkbox" data-setting="followCursor" checked>看看鼠标</label><label><input type="checkbox" data-setting="reducedMotion">轻一点的动作</label></div>
<div class="iris-options" role="group" aria-label="眼芯颜色"><span>眼芯颜色</span><button data-iris="lavender" class="selected" aria-pressed="true"><i class="iris-dot lavender"></i>浅紫色</button><button data-iris="red" aria-pressed="false"><i class="iris-dot red"></i>红色</button></div>
<div class="quality"><span>画质</span><button data-quality="high" class="selected">柔和</button><button data-quality="eco">省电</button></div>
<details><summary>桌面操作和专注计时</summary><p>单击摸摸，点圆手会害羞，点尾巴连拍三下；双击蹦一下。按住提尾巴，晃一晃会掉落米饭和草莓蛋糕；右键可打开完整动作菜单。连摸十次会鼓脸。</p><div class="focus"><input id="minutes" type="number" min="1" max="120" value="25" aria-label="专注分钟数"><span>分钟</span><button id="focus-start">开始专注</button><button id="focus-stop">结束</button></div><p id="focus-state" role="status">我陪你慢慢做。</p></details>
<div class="footer"><span id="stats">OFFLINE COMPANION / 1.2</span><button id="quit">收工，回海里</button></div>
<details id="review" hidden><summary>姿态检查</summary><button id="review-lift">检查倒吊</button><button id="review-drop">检查放下</button><button id="review-food">检查晃落点心</button><label>动作时间 <input id="review-time" type="number" value="1.2" min="0" max="8" step="0.1"></label><button id="freeze">定格当前动作</button><button id="resume">恢复播放</button><button id="review-save">保存检查图</button><output id="review-info"></output></details>
</section></main><script type="module" src="home.js"></script></body></html>
